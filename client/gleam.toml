name = "client"
version = "0.1.0"
description = "Grow Assist browser shell"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_fetch = ">= 1.4.0 and < 2.0.0"
lustre = ">= 5.8.0 and < 6.0.0"
shared = { path = "../shared" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"
glinter = ">= 2.19.2 and < 2.20.0"

[tools.glinter]
include = ["src/"]

[tools.glinter.rules]
label_possible = "off"
prefer_guard_clause = "off"

[tools.glinter.ignore]
"test/**/*.gleam" = ["assert_ok_pattern"]
